      const limit = window.innerHeight - box.offsetHeight - 16;
      if (lr.bottom > limit) window.scrollBy({ top: lr.bottom - limit, behavior: reduceMotion ? 'auto' : 'smooth' });
      return;
    }
    story.querySelectorAll('.blurred').forEach(e => e.classList.remove('blurred'));
    const lastSid = state.pending[state.pending.length - 1];
    const anchor = story.querySelector('[data-sid="' + lastSid + '"]');
    if (!anchor) return;
    const rects = anchor.getClientRects();
    const r = rects[rects.length - 1];
    const sr = story.getBoundingClientRect();
    const w = box.offsetWidth, h = box.offsetHeight;
    let left = r.left - sr.left;
    left = Math.max(12, Math.min(left, story.clientWidth - w - 12));
    let top = r.bottom - sr.top + 8;
    if (box.classList.contains('chooser-window')) {
      const lh = parseFloat(getComputedStyle(anchor).lineHeight) || 30;
      top = r.bottom - sr.top + 2 * lh + 6;   // leave two lines of the story visible under the selection
      const overflow = top + h + 16 - story.clientHeight;
      story.style.paddingBottom = overflow > 0 ? (20 + overflow) + 'px' : '';
    }

    if (box.classList.contains('chooser-pop')) {
      const roomBelow = window.innerHeight - r.bottom;
      const above = roomBelow < h + 24 && r.top > h + 24;
      if (above) top = r.top - sr.top - h - 10;
      box.classList.toggle('above', above);
      box.classList.toggle('below', !above);
      const caret = Math.max(14, Math.min((r.left + Math.min(r.width, 40) / 2) - sr.left - left - 6, w - 26));
      box.style.setProperty('--caret', caret + 'px');
    }
    box.style.left = left + 'px';
    box.style.top = top + 'px';

    if (box.classList.contains('chooser-window')) {
      const br = box.getBoundingClientRect();
      story.querySelectorAll('.seg, .hl-num').forEach(seg => {
        if (seg.classList.contains('pending')) return;
        for (const cr of seg.getClientRects()) {
          if (cr.bottom > br.top - 2 && cr.top < br.bottom + 2) { seg.classList.add('blurred'); break; }
        }
      });
      const viewBottom = window.innerHeight;
      if (br.bottom > viewBottom - 8) box.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'nearest' });
    }
  }
  window.addEventListener('resize', () => { if (document.getElementById('chooser')) renderApp(); });

  function linkItem(q, item, on) {
    item.sectionIds.forEach(sid => {
      const seg = document.querySelector('#passage [data-sid="' + sid + '"]');
      if (seg) seg.classList.toggle('linked', on);
    });
    const card = document.getElementById('item-' + item.id);
    if (card) card.classList.toggle('active', on);
  }

  function renderNoteCard(q, item, n) {
    const card = el('div', 'note-card');
    card.id = 'item-' + item.id;
    if (state.adding === item.id) card.classList.add('adding');
    if (annotateNewId === item.id) card.classList.add('new');

    const head = el('div', 'note-head');
    const badge = el('span', 'hl-num', String(n));
    badge.setAttribute('aria-hidden', 'true');
    head.appendChild(badge);
    head.appendChild(el('span', 'small-label', 'Highlight ' + n));
    card.appendChild(head);
    card.appendChild(el('p', 'note-quote', '“' + quoteText(item.sectionIds) + '”'));

    if (state.adding === item.id) {
      card.appendChild(el('p', 'note-tip', 'Tap more parts of the story to add them to this highlight. Tap an added part again to take it out.'));
    }

    const key = noteKey(q, item);
    const field = textField(key, 'Now tell us what this shows', 'Type here…');
    const lab = field.querySelector('.field-label');
    if (lab) lab.classList.add('note-heading');
    const quoteEl = card.querySelector('.note-quote');
    if (lab && quoteEl) { field.insertBefore(quoteEl, lab.nextSibling); }
    card.appendChild(field);
    if (SHOW_NOTE_STATUS) {
      const answered = () => !!((state.text[key] || '').trim() || state.voice[key]);
      const chip = el('span', 'note-status');
      const paint = () => {
        const ok = answered();
        chip.textContent = ok ? 'Saved \u2713' : 'Waiting for your explanation';
        chip.className = 'note-status ' + (ok ? 'saved' : 'waiting');
      };
      paint();
      head.appendChild(chip);
      const ta = field.querySelector('textarea');
      if (ta) ta.addEventListener('input', paint);
    }

    if (state.items[q.id].length === 1 && state.adding !== item.id) {
      card.appendChild(el('p', 'note-tip', 'For your next point, tap another part of the story.'));
    }
    const actions = el('div', 'item-actions');
    if (state.adding === item.id) {
      actions.appendChild(button('small-btn', 'Finished adding', () => { state.adding = null; renderApp(); focusNote(item.id); }));
    } else {
      actions.appendChild(button('text-link-btn', 'Add more text to this', () => {
        if (rec) stopRecording();
        state.adding = item.id;
        renderApp();
        if (wideQuery.matches) return;
        requestAnimationFrame(() => {
          const first = document.querySelector('#passage [data-sid="' + item.sectionIds[0] + '"]');
          if (first) first.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'center' });
        });
      }));
    }
    actions.appendChild(button('text-link-btn', 'Remove', () => {
      const key = noteKey(q, item);
      const hasWork = (state.text[key] || '').trim() || state.voice[key];
      if (hasWork && !window.confirm('Remove this highlight and what you wrote about it?')) return;
      if (rec) stopRecording();
      state.items[q.id] = state.items[q.id].filter(x => x.id !== item.id);
      dropKeys(q.id + '.' + item.id + '.');
      if (state.adding === item.id) state.adding = null;
      renderApp();
    }));
    card.appendChild(actions);

    card.addEventListener('mouseenter', () => linkItem(q, item, true));
    card.addEventListener('mouseleave', () => { if (!card.contains(document.activeElement)) linkItem(q, item, false); });
    card.addEventListener('focusin', () => linkItem(q, item, true));
    card.addEventListener('focusout', e => { if (!card.contains(e.relatedTarget)) linkItem(q, item, false); });
    return card;
  }

  function renderAnnotateStep(q, pageIdx, all) {
    const wide = wideQuery.matches;
    const items = state.items[q.id];
    const done = hasContent(q);

    stepContainer.appendChild(el('p', 'instruction', 'Now look at the story again and answer the second question.'));

    const qcard = el('section', 'qcard q-compact');
    qcard.id = 'q-' + q.id;
    if (state.showErrors && !done) qcard.classList.add('needs-answer');
    const head = el('div', 'q-head');
    head.appendChild(el('span', 'q-num', 'Question ' + (pageIdx + 1) + ' of ' + all.length));
    const pill = el('span', 'q-status' + (done ? ' done' : ''), done ? 'Answered' : 'Not answered yet');
    pill.setAttribute('data-status', q.id);
    head.appendChild(pill);
    qcard.appendChild(head);
    const qt = el('p', 'q-text', q.text);
    qt.id = 'q-' + q.id + '-text';
    qcard.appendChild(qt);
    qcard.setAttribute('aria-labelledby', qt.id);
    qcard.appendChild(el('p', 'hint', 'Tap the parts of the story that tell you something. When you’ve selected what you want, choose “Done, explain this” and a box opens ' + (wide ? 'beside the story' : 'below it') + ' for you to say what it tells you. You can type, record a voice note, or both.'));
    const err = el('p', 'q-error', 'Highlight at least one part of the story and say what it tells you.');
    err.hidden = !(state.showErrors && !done);
    qcard.appendChild(err);
    stepContainer.appendChild(qcard);

    const wrap = el('div', 'annotate' + (wide ? ' wide' : ''));
    wrap.id = 'annotate';
    const story = el('section', 'scenario-card' + (state.adding ? ' adding' : ''));
    story.id = 'passage';
    story.setAttribute('aria-label', 'The story. Tap a part to highlight it.');

    const addingItem = state.adding && items.find(x => x.id === state.adding);
    if (addingItem) {
      const banner = el('div', 'adding-banner');
      banner.appendChild(el('span', null, 'Adding to highlight ' + (items.indexOf(addingItem) + 1) + ': tap more parts of the story.'));
      banner.appendChild(button('small-btn', 'Finished adding', () => { const id = state.adding; state.adding = null; renderApp(); focusNote(id, 'center'); }));
      story.appendChild(banner);
    }

    const numberOf = {};
    items.forEach((it, i) => { numberOf[it.id] = i + 1; });
    const lastSidOf = {};
    items.forEach(it => { lastSidOf[it.sectionIds[it.sectionIds.length - 1]] = it; });

    PARAGRAPHS.forEach((_, pIdx) => {
      const p = el('p');
      const secs = SECTIONS.filter(s => s.paragraph === pIdx);
      secs.forEach((s, i) => {
        const span = el('span', 'seg mark', s.text);
        span.setAttribute('data-sid', s.id);
        span.tabIndex = 0;
        span.setAttribute('role', 'button');
        const owner = ownerOf(q.id, s.id);
        if (owner) {
          span.classList.add('marked');
          span.setAttribute('aria-pressed', 'true');
          span.setAttribute('aria-label', s.text + ' (highlight ' + numberOf[owner.id] + ')');
          if (state.adding === owner.id) span.classList.add('adding-in');
        } else if (state.pending.indexOf(s.id) !== -1) {
          span.classList.add('pending');
          span.setAttribute('aria-pressed', 'true');
        } else {
          span.setAttribute('aria-pressed', 'false');
        }
        const tap = () => onStoryTap(q, s.id);
        span.addEventListener('click', tap);
        span.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tap(); } });
        p.appendChild(span);

        const endsItem = lastSidOf[s.id];
        if (endsItem) {
          const badge = button('hl-num', String(numberOf[endsItem.id]), () => focusNote(endsItem.id, 'center'));
          badge.setAttribute('aria-label', 'Go to highlight ' + numberOf[endsItem.id]);
          p.appendChild(badge);
        }
        if (i < secs.length - 1) p.appendChild(document.createTextNode(' '));
      });
      story.appendChild(p);

      if (!wide) {
        items.filter(it => SECTIONS[sectionIndex(it.sectionIds[it.sectionIds.length - 1])].paragraph === pIdx)
          .forEach(it => story.appendChild(renderNoteCard(q, it, numberOf[it.id])));
      }
    });
    wrap.appendChild(story);

    if (wide) {
      const notes = el('div', 'notes');
      notes.id = 'notes';
      notes.setAttribute('aria-label', 'Your highlights and explanations');
      if (!items.length) {
        const empty = el('div', 'notes-empty');
        empty.appendChild(el('strong', null, 'Your explanations will appear here'));
        empty.appendChild(document.createTextNode('Tap a part of the story to highlight it. A box will open here, level with it, for you to explain what it tells you.'));
        notes.appendChild(empty);
      }
      items.forEach(it => notes.appendChild(renderNoteCard(q, it, numberOf[it.id])));
      wrap.appendChild(notes);
    }
    stepContainer.appendChild(wrap);
    renderChooser(q, story);
    annotateNewId = null;

    if (wide) {
      requestAnimationFrame(layoutNotes);
      if (window.ResizeObserver) {
        const ro = new ResizeObserver(() => layoutNotes());
        ro.observe(story);
        wrap.querySelectorAll('.note-card').forEach(c => ro.observe(c));
      }
    }

    const summary = el('p', 'form-error', done ? '' : 'Question ' + (pageIdx + 1) + ' still needs an answer.');
    summary.id = 'questions-error';
    summary.setAttribute('role', 'alert');
    summary.hidden = !(state.showErrors && !done);
    stepContainer.appendChild(summary);

    const last = pageIdx === all.length - 1;
    const annBtn = button('fia-btn', last ? 'Continue to review' : 'Continue', () => {
      if (rec) stopRecording();
      state.adding = null;
      state.pending = [];
      if (!hasContent(q)) {
        state.showErrors = true;
        renderApp();
        scrollToEl('q-' + q.id);
        return;
      }
      state.showErrors = false;
      state.step = state.step + 1;
      renderApp();
      window.scrollTo(0, 0);
    });
    stepContainer.appendChild(annBtn);
    stepContainer.appendChild(gateButton(annBtn, q, () => itemsGap(q)));
  }

  /* Wide screens: place each explanation level with its highlight, pushing cards down so they never overlap. */
  function layoutNotes() {
    const wrap = document.getElementById('annotate');
    const notes = document.getElementById('notes');
    if (!wrap || !notes || !wrap.classList.contains('wide')) return;
    const q = questions()[state.step - 1];
    if (!q || q.kind !== 'items') return;
    const base = notes.getBoundingClientRect().top;
    let bottom = 0;
    state.items[q.id].forEach(it => {
      const card = document.getElementById('item-' + it.id);
      const anchor = document.querySelector('#passage [data-sid="' + it.sectionIds[0] + '"]');
      if (!card || !anchor) return;
      const desired = Math.max(0, anchor.getBoundingClientRect().top - base - 14);
      const top = Math.max(desired, bottom ? bottom + 14 : 0);
      card.style.top = top + 'px';
      bottom = top + card.offsetHeight;
    });
    notes.style.minHeight = bottom + 'px';
  }

  /* =========================================================
     Step 2: review
     ========================================================= */
  function reviewText(container, label, key) {
    if (label) container.appendChild(el('span', 'small-label', label));
    const t = (state.text[key] || '').trim();
    const v = state.voice[key];
    if (t) container.appendChild(el('p', 'review-answer', t));
    if (v) {
      const row = el('div', 'review-voice');
      const note = el('div', 'voice-note');

      else note.appendChild(el('span', 'voice-sim', 'Simulated'));
      row.appendChild(note);
      container.appendChild(row);
    }
    if (!t && !v) container.appendChild(el('p', 'review-answer none', 'No answer'));
  }
  function reviewQuote(container, ids, colorName) {
    const quote = el('div', 'quote');
    const mark = el('span', 'quote-hl', '“' + quoteText(ids) + '”');
    mark.style.setProperty('--t', COLORS[colorName].tint);

  /* ---------- Before-review snapshot and change summary ---------- */
  function currentAnswers() {
    const qs = questions();
    const q1 = qs[0], q2 = qs[1];
    const noteKey = q2.fields[0].key;
    const q1Key = q1.id + '.answer';
    return {
      prediction: { text: (state.text[q1Key] || '').trim(), voice: !!state.voice[q1Key] },
      highlights: state.items[q2.id].map(item => {
        const key = q2.id + '.' + item.id + '.' + noteKey;
        return {
          id: item.id,
          sectionIds: item.sectionIds.slice(),
          quote: quoteText(item.sectionIds),
          explanation: (state.text[key] || '').trim(),
          voice: !!state.voice[key]
        };
      })
    };
  }

  function takeFirstReviewSnapshot() {
    if (state.firstReview) return;
    state.firstReview = { at: Date.now(), answers: currentAnswers() };
  }

  function wordDiff(before, after) {
    const norm = t => t.toLowerCase().replace(/[^\p{L}\p{N}\s'’]/gu, ' ').split(/\s+/).filter(Boolean);
    const a = norm(before), b = norm(after);
    const dp = Array.from({ length: a.length + 1 }, () => new Array(b.length + 1).fill(0));
    for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--) {
      dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    }
    const common = dp[0][0];
    return { added: b.length - common, removed: a.length - common };
  }

  function reviewChanges() {
    const snap = state.firstReview;
    if (!snap) return null;
    const before = snap.answers, after = currentAnswers();
    const status = {};
    let added = 0, removed = 0, reworded = 0, rehighlighted = 0, voiceAdded = 0, voiceDeleted = 0;
    const beforeById = {};
    before.highlights.forEach(h => { beforeById[h.id] = h; });

    after.highlights.forEach(h => {
      const old = beforeById[h.id];
      if (!old) { added++; status[h.id] = 'Added in review'; if (h.voice) voiceAdded++; return; }
      const moved = old.sectionIds.join(',') !== h.sectionIds.join(',');
      const rewrote = old.explanation !== h.explanation;
      if (moved) rehighlighted++;
      if (rewrote) reworded++;
      if (old.voice && !h.voice) voiceDeleted++;
      if (!old.voice && h.voice) voiceAdded++;
      status[h.id] = moved && rewrote ? 'Re-highlighted and reworded in review'
        : moved ? 'Re-highlighted in review'
        : rewrote ? 'Reworded in review'
        : 'Unchanged';
    });
    const afterIds = after.highlights.map(h => h.id);
    const removedList = before.highlights.filter(h => afterIds.indexOf(h.id) === -1);
    removed = removedList.length;
    removedList.forEach(h => { if (h.voice) voiceDeleted++; });

    if (before.prediction.voice && !after.prediction.voice) voiceDeleted++;
    if (!before.prediction.voice && after.prediction.voice) voiceAdded++;
    const words = wordDiff(before.prediction.text, after.prediction.text);
    const q1Changed = before.prediction.text !== after.prediction.text || before.prediction.voice !== after.prediction.voice;

    return {
      secondsFromFirstReview: Math.round((Date.now() - snap.at) / 1000),
      q1Changed: q1Changed,
      q1WordsAdded: words.added,
      q1WordsRemoved: words.removed,
      highlightsBefore: before.highlights.length,
      highlightsAfter: after.highlights.length,
      added: added, removed: removed, reworded: reworded, rehighlighted: rehighlighted,
      voiceAdded: voiceAdded, voiceDeleted: voiceDeleted,
      statusById: status,
      before: {
        prediction: before.prediction,
        highlights: before.highlights.map(h => ({ quote: h.quote, explanation: h.explanation, voice: h.voice }))
      },
      removedHighlights: removedList.map(h => ({ quote: h.quote, explanation: h.explanation, voice: h.voice }))
    };
  }

  function renderReviewStep() {
    takeFirstReviewSnapshot();
    stepContainer.appendChild(el('h1', null, 'Review and submit'));
    stepContainer.appendChild(el('p', 'hint', 'Check your answers, then submit. Tap Edit to change anything.'));

    questions().forEach((q, idx) => {
      const block = el('div', 'review-block');
      const header = el('div', 'review-block-header');
      header.appendChild(el('h3', null, 'Question ' + (idx + 1)));
      header.appendChild(button('text-link-btn', 'Edit', () => {
        state.step = idx + 1;
        renderApp();
        scrollToEl('q-' + q.id);
      }));
      block.appendChild(header);
      block.appendChild(el('p', 'review-q', q.text));

      if (q.kind === 'text') {
        const e = el('div', 'review-entry');
        reviewText(e, q.label || 'Your answer', q.id + '.answer');
        block.appendChild(e);
      }

      if (q.kind === 'items') {
        (q.before || []).forEach(f => { const e = el('div', 'review-entry'); reviewText(e, f.label, q.id + '.' + f.key); block.appendChild(e); });
        if (!state.items[q.id].length) block.appendChild(el('p', 'review-answer none', 'Nothing highlighted'));
        state.items[q.id].forEach(item => {
          const color = itemColor(q, item);
          const e = el('div', 'review-entry');
          e.style.setProperty('--c', COLORS[color].solid);
          reviewQuote(e, item.sectionIds, color);
          q.fields.forEach(f => {
            const key = q.id + '.' + item.id + '.' + f.key;
            if (f.type === 'chips') {
              e.appendChild(el('span', 'small-label', f.label));
              e.appendChild(el('p', 'review-answer' + (state.choice[key] ? '' : ' none'), state.choice[key] || 'Not chosen'));
            } else reviewText(e, f.label, key);
          });
          block.appendChild(e);
        });
        (q.after || []).forEach(f => { const e = el('div', 'review-entry'); reviewText(e, f.label, q.id + '.' + f.key); block.appendChild(e); });
      }

      if (q.kind === 'compare') {
        const grid = el('div', 'compare-grid');
        q.sides.forEach(side => {
          const c = COLORS[side.color];
          const col = el('div', 'compare-col');
          col.style.setProperty('--c', c.solid);
          col.style.setProperty('--t', c.tint);
          const h = el('h4'); h.appendChild(swatch(side.color)); h.appendChild(document.createTextNode(side.label)); col.appendChild(h);
          state.sides[q.id][side.key].forEach(ids => col.appendChild(el('div', 'quote-chip', '“' + quoteText(ids) + '”')));
          reviewText(col, side.prompt, q.id + '.side.' + side.key);
          grid.appendChild(col);
        });
        block.appendChild(grid);
        const e = el('div', 'review-entry');
        reviewText(e, q.conclusion, q.id + '.conclusion');
        block.appendChild(e);
      }

      if (q.kind === 'explanations') {
        const list = state.expl[q.id];
        list.forEach((ex, i) => {
          const e = el('div', 'review-entry');
          e.style.setProperty('--t', COLORS.yellow.tint);
          reviewText(e, 'Explanation ' + (i + 1), q.id + '.expl.' + ex.id);
          ex.quotes.forEach(ids => reviewQuote(e, ids, 'yellow'));
          block.appendChild(e);
        });
        const bestIdx = list.findIndex(ex => ex.id === state.choice[q.id + '.best']);
        const e = el('div', 'review-entry');
        e.appendChild(el('span', 'small-label', 'Best supported'));
        e.appendChild(el('p', 'review-answer' + (bestIdx < 0 ? ' none' : ''), bestIdx < 0 ? 'Not chosen' : 'Explanation ' + (bestIdx + 1)));
        reviewText(e, 'What separates it from the others', q.id + '.why');
        block.appendChild(e);
      }

      stepContainer.appendChild(block);
    });

    const saveError = el('p', 'form-error', '');
    saveError.setAttribute('role', 'alert');
    saveError.hidden = true;
    stepContainer.appendChild(saveError);
    const submitBtn = button('fia-btn', 'Submit response', () => submitResponse(submitBtn, saveError));
    stepContainer.appendChild(submitBtn);
  }

  async function submitResponse(btn, errEl) {
    if (rec) stopRecording();
    state.elapsed = Math.round((Date.now() - state.sessionStart) / 1000);
    let savedNote = 'Not set up (testing)';
    if (SHEET_ENDPOINT) {
      btn.disabled = true;
      btn.textContent = 'Saving your response…';
      errEl.hidden = true;
      try {
        const payload = await buildSheetPayload();
        let res;
        try {
          res = await fetch(SHEET_ENDPOINT, { method: 'POST', body: JSON.stringify(payload) });
        } catch (netErr) {
          throw new Error('Couldn’t reach the Google script (' + netErr.message + ')');
        }
        const raw = await res.text();
        let out;
        try { out = JSON.parse(raw); }
        catch (parseErr) {
          throw new Error('Unexpected reply from the Google script (status ' + res.status + '): ' +
            raw.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 240));
        }
        if (!out.ok) throw new Error('Google script error: ' + (out.error || 'unknown'));
        savedNote = 'Yes';
      } catch (err) {
        console.error('Saving failed:', err);
        errEl.textContent = 'We couldn’t save your response. Check your internet connection and try again. Your answers are still here.\n\nDetails for the researcher: ' + err.message;
        errEl.style.whiteSpace = 'pre-wrap';
        errEl.hidden = false;
        btn.disabled = false;
        btn.textContent = 'Try again';
        return;
      }
    }
    showCompletion(savedNote);
  }

  function showCompletion(savedNote) {
    document.getElementById('stat-participant').textContent = state.participant.code;
    document.getElementById('stat-time').textContent = fmt(state.elapsed);
    document.getElementById('stat-highlights').textContent = String(allQuoteGroups().length);
    document.getElementById('stat-voice').textContent = String(Object.keys(state.voice).length);
    document.getElementById('stat-saved').textContent = savedNote;
    appMain.hidden = true;
    screenComplete.hidden = false;
    document.getElementById('download-json').hidden = !RESEARCHER;
    window.scrollTo(0, 0);
  }

  /* =========================================================
     Google Sheets payload
     ========================================================= */
  function blobToBase64(blob) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(String(r.result).split(',')[1] || '');
      r.onerror = () => reject(new Error('Could not read voice note'));
      r.readAsDataURL(blob);
    });
  }

  /* One row per response: code, name, time, the Q1 prediction, then each Q2 highlight
     with what it tells the participant. Voice notes are sent as audio and linked by id. */
  async function buildSheetPayload() {
    const qs = questions();
    const q1 = qs[0], q2 = qs[1];
    const noteKey = q2.fields[0].key;
    const voiceNotes = [];
    async function voiceRef(key) {
      const v = state.voice[key];
      if (!v) return null;
      if (v.blob) {
        voiceNotes.push({ id: key, mime: v.mime || 'audio/webm', seconds: v.duration, data: await blobToBase64(v.blob) });
        return { id: key, seconds: v.duration };
      }
      return { simulated: true, seconds: v.duration };
    }
    const q1Key = q1.id + '.answer';
    const prediction = { text: (state.text[q1Key] || '').trim(), voice: await voiceRef(q1Key) };
    const highlights = [];
    const changes = reviewChanges();
    for (const item of state.items[q2.id]) {
      const key = q2.id + '.' + item.id + '.' + noteKey;
      highlights.push({
        quote: quoteText(item.sectionIds),
        explanation: (state.text[key] || '').trim(),
        voice: await voiceRef(key),
        reviewStatus: changes ? changes.statusById[item.id] : ''
      });
    }
    return {
      format: 'two-question',
      code: state.participant.code,
      responseId: state.responseId,
      submittedAt: new Date().toISOString(),
      name: state.participant.name,
      scenario: SCENARIO_ID + ' (' + PAGE_VERSION + ')',
      version: PAGE_VERSION,
      secondsSpent: state.elapsed,
      prediction: prediction,
      review: changes,
      highlights: highlights,
      voiceNotes: voiceNotes,
      full: buildExport()
    };
  }

  /* =========================================================
     Export (researcher)
     ========================================================= */
  function answerOf(key) {
    const v = state.voice[key];
    return { text: (state.text[key] || '').trim(), voiceNote: v ? { seconds: v.duration, simulated: !!v.simulated } : null };
  }
  function buildExport() {
    return {
      participant: { name: state.participant.name, code: state.participant.code },
      scenario: SCENARIO_ID + ' (' + PAGE_VERSION + ')',
      version: PAGE_VERSION,
      submittedAt: new Date().toISOString(),
      secondsSpent: state.elapsed,
      reviewChanges: reviewChanges(),
      answers: questions().map(q => {
        const out = { id: q.id, question: q.text };
        if (q.kind === 'text') out.answer = answerOf(q.id + '.answer');
        if (q.kind === 'items') {
          (q.before || []).concat(q.after || []).forEach(f => { out[f.key] = answerOf(q.id + '.' + f.key); });
          out.highlights = state.items[q.id].map(item => {
            const h = { quote: quoteText(item.sectionIds), sectionIds: item.sectionIds };
            q.fields.forEach(f => {
              const key = q.id + '.' + item.id + '.' + f.key;
              h[f.key] = f.type === 'chips' ? (state.choice[key] || null) : answerOf(key);
            });
            return h;
          });
        }
        if (q.kind === 'compare') {
          q.sides.forEach(side => {
            out[side.label] = {
              colour: COLORS[side.color].name,
              highlights: state.sides[q.id][side.key].map(quoteText),
              answer: answerOf(q.id + '.side.' + side.key)
            };
          });
          out.conclusion = answerOf(q.id + '.conclusion');
        }
        if (q.kind === 'explanations') {
          const list = state.expl[q.id];
          out.explanations = list.map(ex => ({ answer: answerOf(q.id + '.expl.' + ex.id), support: ex.quotes.map(quoteText) }));
          const bestIdx = list.findIndex(ex => ex.id === state.choice[q.id + '.best']);
          out.bestSupported = bestIdx < 0 ? null : bestIdx + 1;
          out.whatSeparatesIt = answerOf(q.id + '.why');
        }
        return out;
      })
    };
  }
  document.getElementById('download-json').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(buildExport(), null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'response-' + (state.participant.code || 'participant') + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
  });

  /* =========================================================
     Intro
     ========================================================= */

    ['Read a short story.', 'It is fictional. Someone describes a situation in their own words.'],
    ['Answer two questions about it, one per page.', 'The second asks you to highlight parts of the story and explain your choice.'],

  ];

        '<h3>Your privacy and consent</h3>' +
        '<p class="consent">This is a research project run by the Feminine Intelligence Agency with students from Northeastern University.</p>' +

    stepContainer.appendChild(wrap);

    const P = state.participant;

    nameInput.value = P.name || '';
    /* First name (can be more than one word) followed by a single-letter last initial, e.g. "Sam K" or "Mary Ann K." */
    const NAME_RE = /^(.+?)\s+(\p{L})\.?$/u;
    const cleanName = () => nameInput.value.trim().replace(/\s+/g, ' ');
    const nameOk = () => NAME_RE.test(cleanName());

    const startBtn = button('fia-btn', 'Start', () => {
      const m = cleanName().match(NAME_RE);

  /* Load the story, then start. */
  (async function start() {
    stepContainer.innerHTML = '<p class="instruction">Loading…</p>';
    let data;
    try {
      data = await fetchScenarios();
    } catch (e) {
      console.error(e);
      stepContainer.innerHTML = '';
      stepContainer.appendChild(el('h2', null, 'The study couldn’t load'));
      stepContainer.appendChild(el('p', null, 'Please check your internet connection and refresh the page. If it still doesn’t load, contact the person who sent you the link.'));
      return;
    }
    const wanted = new URLSearchParams(window.location.search).get('s') || data.default;
    const sc = (data.scenarios || []).find(x => String(x.id).toLowerCase() === String(wanted || '').toLowerCase());
    if (!sc || !Array.isArray(sc.paragraphs) || !sc.paragraphs.length) {
      stepContainer.innerHTML = '';
      stepContainer.appendChild(el('h2', null, 'This link doesn’t match a story'));
      stepContainer.appendChild(el('p', null, 'Please check that you copied the whole link, or contact the person who sent it to you.'));
      return;
    }
    useScenario(sc);
    renderApp();
  })();
</script>
